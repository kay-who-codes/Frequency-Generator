<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreqGen — Signal Frequency Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #131313;
    --bg-elevated: #1c1c1c;
    --bg-card: #1f1f1f;
    --surface: #252525;
    --surface-hover: #2e2e2e;
    --border: #333;
    --primary: #4caf50;
    --primary-dim: rgba(76, 175, 80, 0.14);
    --primary-glow: rgba(76, 175, 80, 0.4);
    --secondary: #ff4081;
    --secondary-dim: rgba(255, 64, 129, 0.15);
    --text: #e8e8e8;
    --text-muted: #888;
    --text-dim: #555;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Rajdhani', sans-serif;
    --radius: 4px;
    --radius-lg: 8px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(76,175,80,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,175,80,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  main {
    width: 100%;
    max-width: 680px;
    padding: 2rem 1.25rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 2.25rem;
    padding-top: 0.5rem;
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 0.35rem;
  }

  .logo-svg { width: 30px; height: 30px; flex-shrink: 0; }

  h1 {
    font-family: var(--display);
    font-size: clamp(1.7rem, 5.5vw, 2.5rem);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
  }

  h1 span { color: var(--primary); }

  .subtitle {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  /* Oscilloscope */
  .oscilloscope {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 1.25rem;
    padding: 0.75rem;
    position: relative;
    overflow: hidden;
  }

  .oscilloscope::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(76,175,80,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  canvas#scope {
    width: 100%;
    height: 120px;
    display: block;
    border-radius: var(--radius);
  }

  .scope-label {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.4rem;
    text-align: center;
  }

  /* Frequency readout */
  .freq-display {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
    text-align: center;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .freq-display.playing {
    border-color: var(--primary);
    box-shadow: 0 0 24px var(--primary-dim), inset 0 0 30px rgba(76,175,80,0.02);
  }

  .freq-readout {
    font-family: var(--mono);
    font-size: clamp(2.4rem, 10vw, 4rem);
    font-weight: 400;
    color: var(--primary);
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 20px var(--primary-glow);
    transition: text-shadow var(--transition);
  }

  .freq-readout.playing {
    text-shadow: 0 0 30px var(--primary-glow), 0 0 60px rgba(76,175,80,0.2);
  }

  .freq-unit {
    font-family: var(--mono);
    font-size: clamp(0.8rem, 3vw, 1rem);
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-top: 0.2rem;
  }

  .freq-note {
    font-family: var(--mono);
    font-size: 0.63rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: 0.45rem;
    min-height: 1em;
  }

  /* Play button */
  .play-section {
    display: flex;
    justify-content: center;
    margin-bottom: 1.25rem;
  }

  .play-btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    background: var(--primary-dim);
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
  }

  .play-btn::before {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1px solid rgba(76,175,80,0.2);
    transition: all 0.3s ease;
  }

  .play-btn:hover {
    background: rgba(76,175,80,0.22);
    box-shadow: 0 0 28px var(--primary-glow);
    transform: scale(1.05);
  }

  .play-btn:hover::before { inset: -12px; border-color: rgba(76,175,80,0.1); }

  .play-btn.playing {
    animation: pulse-ring 2.2s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 18px var(--primary-glow); }
    50% { box-shadow: 0 0 40px var(--primary-glow), 0 0 70px rgba(76,175,80,0.12); }
  }

  /* Input section */
  section.input-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--text-dim);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Waveform */
  .wave-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.85rem;
  }

  .wave-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 0.6rem;
    padding: 0.55rem 0.25rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .wave-btn svg {
    width: 28px;
    height: 13px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .wave-btn:hover { border-color: var(--primary); color: var(--primary); }
  .wave-btn.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

  /* Custom input row */
  .custom-input-row {
    display: flex;
    gap: 0.75rem;
    align-items: stretch;
  }

  .input-wrapper { flex: 1; position: relative; }

  input[type="number"] {
    width: 100%;
    height: 52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 1.05rem;
    padding: 0 3.5rem 0 1rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    -moz-appearance: textfield;
    appearance: textfield;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary-dim);
  }

  input[type="number"]::placeholder { color: var(--text-dim); }
  input[type="number"].invalid {
    border-color: var(--secondary) !important;
    box-shadow: 0 0 0 2px var(--secondary-dim) !important;
  }

  .hz-badge {
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  .input-error {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--secondary);
    letter-spacing: 0.1em;
    margin-top: 0.4rem;
    min-height: 1em;
  }

  .apply-btn {
    height: 52px;
    padding: 0 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 68px;
  }

  .apply-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-dim);
  }

  /* Slider */
  .slider-row { margin-top: 0.85rem; }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.56rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 0.3rem;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--surface);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--primary) var(--fill,0%), var(--surface) var(--fill,0%));
  }

  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface); }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--primary); }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid var(--bg);
    cursor: pointer;
    box-shadow: 0 0 8px var(--primary-glow);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 0 14px var(--primary-glow);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px var(--primary-glow);
  }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.85rem;
  }

  .vol-icon { flex-shrink: 0; color: var(--text-dim); width: 16px; }

  input[type="range"].vol-slider { height: 3px; }

  input[type="range"].vol-slider::-webkit-slider-thumb {
    width: 14px; height: 14px;
    background: var(--text-muted);
    box-shadow: none;
  }

  input[type="range"].vol-slider::-webkit-slider-runnable-track {
    height: 3px;
    background: linear-gradient(to right, var(--text-muted) var(--fill,70%), var(--surface) var(--fill,70%));
  }

  .vol-label {
    font-family: var(--mono);
    font-size: 0.63rem;
    color: var(--text-dim);
    min-width: 2.5rem;
    text-align: right;
    letter-spacing: 0.05em;
  }

  /* Presets */
  section.presets-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .preset-group { margin-bottom: 1rem; }
  .preset-group:last-child { margin-bottom: 0; }

  .preset-group-label {
    font-family: var(--mono);
    font-size: 0.56rem;
    color: var(--text-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 0.45rem;
  }

  .preset-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0.55rem 0.4rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    line-height: 1.3;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.15rem;
  }

  .preset-btn:hover {
    background: var(--surface-hover);
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-1px);
  }

  .preset-btn.active {
    background: var(--primary-dim);
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 0 8px var(--primary-dim);
  }

  .preset-btn .preset-hz { font-size: 0.88rem; font-weight: 600; letter-spacing: -0.02em; }
  .preset-btn .preset-name { font-size: 0.53rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .preset-btn.active .preset-name { color: rgba(76,175,80,0.55); }

  /* Status bar */
  .status-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .status-dot.active {
    background: var(--primary);
    box-shadow: 0 0 6px var(--primary);
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .status-value { color: var(--text-muted); }

  /* Responsive */
  @media (max-width: 440px) {
    main { padding: 1.25rem 1rem 3rem; }
    canvas#scope { height: 90px; }
    .preset-grid { grid-template-columns: repeat(3, 1fr); }
    .play-btn { width: 76px; height: 76px; }
    .wave-btn { font-size: 0.55rem; }
    .status-bar { gap: 0.5rem; }
  }

  @media (max-width: 360px) {
    .preset-grid { grid-template-columns: repeat(2, 1fr); }
    .custom-input-row { flex-direction: column; }
    .apply-btn { height: 44px; width: 100%; }
    .wave-row { flex-wrap: wrap; }
    .wave-btn { flex: 1 1 calc(50% - 0.25rem); }
  }
</style>
</head>
<body>
<main>

  <header>
    <div class="logo-line">
      <svg class="logo-svg" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 15 Q5 5 9 15 Q13 25 17 15 Q21 5 25 15 Q27 20 29 15" stroke="#4caf50" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      <h1>Freq<span>Gen</span></h1>
    </div>
    <p class="subtitle">Signal Generator // 1 Hz – 2,000,000 Hz</p>
  </header>

  <!-- Oscilloscope -->
  <div class="oscilloscope" aria-hidden="true">
    <canvas id="scope"></canvas>
    <div class="scope-label">oscilloscope // real-time waveform preview</div>
  </div>

  <!-- Frequency Readout -->
  <div class="freq-display" id="freqDisplay" aria-live="polite">
    <div class="freq-readout" id="freqReadout">440</div>
    <div class="freq-unit">Hz</div>
    <div class="freq-note" id="freqNote">A4 — Concert Pitch</div>
  </div>

  <!-- Play Button -->
  <div class="play-section">
    <button class="play-btn" id="playBtn" aria-label="Play frequency tone">
      <svg id="iconPlay" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="iconPause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:none">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>
  </div>

  <!-- Custom Input -->
  <section class="input-section" aria-label="Custom frequency input">
    <div class="section-label">Custom Frequency</div>

    <div class="wave-row" role="group" aria-label="Waveform type">
      <button class="wave-btn active" data-wave="sine" aria-pressed="true">
        <svg viewBox="0 0 28 13"><path d="M0 6.5 Q3.5 0 7 6.5 Q10.5 13 14 6.5 Q17.5 0 21 6.5 Q24.5 13 28 6.5"/></svg>
        Sine
      </button>
      <button class="wave-btn" data-wave="square" aria-pressed="false">
        <svg viewBox="0 0 28 13"><path d="M0 10 L0 3 L7 3 L7 10 L14 10 L14 3 L21 3 L21 10 L28 10"/></svg>
        Square
      </button>
      <button class="wave-btn" data-wave="sawtooth" aria-pressed="false">
        <svg viewBox="0 0 28 13"><path d="M0 10 L7 3 L7 10 L14 3 L14 10 L21 3 L21 10 L28 3"/></svg>
        Saw
      </button>
      <button class="wave-btn" data-wave="triangle" aria-pressed="false">
        <svg viewBox="0 0 28 13"><path d="M0 10 L7 3 L14 10 L21 3 L28 10"/></svg>
        Tri
      </button>
    </div>

    <div class="custom-input-row">
      <div class="input-wrapper">
        <input
          type="number"
          id="freqInput"
          placeholder="e.g. 440"
          min="1"
          max="2000000"
          step="any"
          inputmode="decimal"
          aria-label="Frequency in Hz"
        />
        <span class="hz-badge">Hz</span>
      </div>
      <button class="apply-btn" id="applyBtn">Set</button>
    </div>
    <div class="input-error" id="inputError" role="alert" aria-live="polite"></div>

    <div class="slider-row">
      <div class="slider-labels">
        <span>1 Hz</span><span>1 kHz</span><span>10 kHz</span><span>2 MHz</span>
      </div>
      <input type="range" id="freqSlider" min="0" max="1000" step="0.5" value="376" aria-label="Frequency logarithmic slider">
    </div>

    <div class="volume-row">
      <svg class="vol-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 2L4 6H1v4h3l4 4V2z M11.2 4.8a4 4 0 0 1 0 6.4.5.5 0 0 1-.6-.8 3 3 0 0 0 0-4.8.5.5 0 0 1 .6-.8z M13.2 2.8a7 7 0 0 1 0 10.4.5.5 0 0 1-.7-.7 6 6 0 0 0 0-9 .5.5 0 0 1 .7-.7z"/>
      </svg>
      <input type="range" class="vol-slider" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
      <span class="vol-label" id="volLabel">70%</span>
    </div>
  </section>

  <!-- Presets -->
  <section class="presets-section" aria-label="Frequency presets">
    <div class="section-label">Presets</div>

    <div class="preset-group">
      <div class="preset-group-label">Musical Notes (Equal Temperament)</div>
      <div class="preset-grid">
        <button class="preset-btn active" data-freq="440"><span class="preset-hz">440</span><span class="preset-name">A4</span></button>
        <button class="preset-btn" data-freq="261.63"><span class="preset-hz">261.6</span><span class="preset-name">C4</span></button>
        <button class="preset-btn" data-freq="293.66"><span class="preset-hz">293.7</span><span class="preset-name">D4</span></button>
        <button class="preset-btn" data-freq="329.63"><span class="preset-hz">329.6</span><span class="preset-name">E4</span></button>
        <button class="preset-btn" data-freq="349.23"><span class="preset-hz">349.2</span><span class="preset-name">F4</span></button>
        <button class="preset-btn" data-freq="392.00"><span class="preset-hz">392</span><span class="preset-name">G4</span></button>
        <button class="preset-btn" data-freq="493.88"><span class="preset-hz">493.9</span><span class="preset-name">B4</span></button>
        <button class="preset-btn" data-freq="523.25"><span class="preset-hz">523.3</span><span class="preset-name">C5</span></button>
      </div>
    </div>

    <div class="preset-group">
      <div class="preset-group-label">Binaural / Solfeggio</div>
      <div class="preset-grid">
        <button class="preset-btn" data-freq="7.83"><span class="preset-hz">7.83</span><span class="preset-name">Schumann</span></button>
        <button class="preset-btn" data-freq="40"><span class="preset-hz">40</span><span class="preset-name">Gamma</span></button>
        <button class="preset-btn" data-freq="174"><span class="preset-hz">174</span><span class="preset-name">Foundation</span></button>
        <button class="preset-btn" data-freq="432"><span class="preset-hz">432</span><span class="preset-name">Cosmic</span></button>
        <button class="preset-btn" data-freq="528"><span class="preset-hz">528</span><span class="preset-name">Miracle</span></button>
        <button class="preset-btn" data-freq="852"><span class="preset-hz">852</span><span class="preset-name">Intuition</span></button>
      </div>
    </div>

    <div class="preset-group">
      <div class="preset-group-label">Engineering / Test Tones</div>
      <div class="preset-grid">
        <button class="preset-btn" data-freq="20"><span class="preset-hz">20</span><span class="preset-name">Sub Bass</span></button>
        <button class="preset-btn" data-freq="100"><span class="preset-hz">100</span><span class="preset-name">Bass</span></button>
        <button class="preset-btn" data-freq="1000"><span class="preset-hz">1k</span><span class="preset-name">Mid</span></button>
        <button class="preset-btn" data-freq="10000"><span class="preset-hz">10k</span><span class="preset-name">High</span></button>
        <button class="preset-btn" data-freq="18000"><span class="preset-hz">18k</span><span class="preset-name">Ultra</span></button>
        <button class="preset-btn" data-freq="20000"><span class="preset-hz">20k</span><span class="preset-name">Limit</span></button>
      </div>
    </div>
  </section>

  <!-- Status Bar -->
  <div class="status-bar" role="status">
    <div class="status-item">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Idle</span>
    </div>
    <div class="status-item">Wave: <span class="status-value" id="statusWave">Sine</span></div>
    <div class="status-item">Period: <span class="status-value" id="statusPeriod">2.27 ms</span></div>
    <div class="status-item">λ: <span class="status-value" id="statusWavelength">0.78 m</span></div>
  </div>

</main>

<script>
(function () {
  'use strict';

  // State
  let freq      = 440;
  let waveType  = 'sine';
  let playing   = false;
  let vol       = 0.70;
  let audioCtx  = null;
  let osc       = null;
  let gain      = null;
  let rafId     = null;
  let phase     = 0;
  let lastTs    = null;

  // DOM
  const freqReadout   = document.getElementById('freqReadout');
  const freqNote      = document.getElementById('freqNote');
  const freqDisplay   = document.getElementById('freqDisplay');
  const freqInput     = document.getElementById('freqInput');
  const freqSlider    = document.getElementById('freqSlider');
  const volSlider     = document.getElementById('volumeSlider');
  const volLabel      = document.getElementById('volLabel');
  const playBtn       = document.getElementById('playBtn');
  const iconPlay      = document.getElementById('iconPlay');
  const iconPause     = document.getElementById('iconPause');
  const applyBtn      = document.getElementById('applyBtn');
  const inputError    = document.getElementById('inputError');
  const statusDot     = document.getElementById('statusDot');
  const statusText    = document.getElementById('statusText');
  const statusWave    = document.getElementById('statusWave');
  const statusPeriod  = document.getElementById('statusPeriod');
  const statusLambda  = document.getElementById('statusWavelength');
  const scopeCanvas   = document.getElementById('scope');
  const waveBtns      = document.querySelectorAll('.wave-btn');
  const presetBtns    = document.querySelectorAll('.preset-btn');

  // Canvas
  const dpr = window.devicePixelRatio || 1;
  const ctx  = scopeCanvas.getContext('2d');

  function resizeCanvas() {
    const w = scopeCanvas.parentElement.clientWidth - 24;
    const h = window.innerWidth <= 440 ? 90 : 120;
    scopeCanvas.width  = Math.round(w * dpr);
    scopeCanvas.height = Math.round(h * dpr);
    scopeCanvas.style.height = h + 'px';
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Utilities
  function fmtFreq(f) {
    if (f >= 1e6)  return (f / 1e6).toFixed(f % 1e6 === 0 ? 0 : 2) + ' MHz';
    if (f >= 1000) return (f / 1000).toFixed(f % 1000 === 0 ? 0 : f % 100 === 0 ? 1 : 2) + ' kHz';
    return parseFloat(f.toFixed(2)).toString() + ' Hz';
  }

  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const NOTE_DESC  = { A4:'Concert Pitch', C4:'Middle C', C5:'Tenor High C', E4:'Guitar High E' };

  function freqToNote(f) {
    if (f < 16 || f > 8000) return '';
    const semi = 12 * Math.log2(f / 440);
    const r    = Math.round(semi);
    const cents = Math.round((semi - r) * 100);
    const ni  = ((r % 12) + 12) % 12;
    const oct = 4 + Math.floor((r + 9) / 12);
    const name = NOTE_NAMES[ni] + oct;
    const cs   = cents === 0 ? '' : cents > 0 ? ` +${cents}¢` : ` ${cents}¢`;
    const desc = NOTE_DESC[name] ? ` — ${NOTE_DESC[name]}` : '';
    return name + cs + desc;
  }

  function fmtPeriod(f) {
    const p = 1 / f;
    if (p < 1e-3) return (p * 1e6).toFixed(1) + ' µs';
    if (p < 1)    return (p * 1e3).toFixed(2) + ' ms';
    return p.toFixed(3) + ' s';
  }

  function fmtWavelength(f) {
    const w = 343 / f;
    if (w < 0.01)   return (w * 100).toFixed(2) + ' cm';
    if (w >= 1000)  return (w / 1000).toFixed(1) + ' km';
    return w.toFixed(2) + ' m';
  }

  // Slider ↔ freq (logarithmic mapping)
  const LOG_MAX = Math.log10(2e6);
  function sliderToFreq(v)  { return Math.pow(10, (v / 1000) * LOG_MAX); }
  function freqToSlider(f)  { return (Math.log10(f) / LOG_MAX) * 1000; }

  function setSliderFill(el, pct) { el.style.setProperty('--fill', pct.toFixed(1) + '%'); }

  // Update all displays from a frequency value
  function applyFreq(f, skipSlider) {
    freq = f;
    freqReadout.textContent = fmtFreq(f);
    freqNote.textContent    = freqToNote(f) || '\u00A0';
    statusPeriod.textContent = fmtPeriod(f);
    statusLambda.textContent = fmtWavelength(f);
    if (!skipSlider) {
      freqSlider.value = freqToSlider(f).toFixed(2);
    }
    setSliderFill(freqSlider, (parseFloat(freqSlider.value) / 10));
    // Preset highlight
    presetBtns.forEach(b => b.classList.toggle('active', Math.abs(parseFloat(b.dataset.freq) - f) < 0.02));
    // Live oscillator update
    if (osc && gain) osc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.01);
  }

  // Audio
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gain = audioCtx.createGain();
    gain.gain.value = 0;
    gain.connect(audioCtx.destination);
  }

  function startTone() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (osc) { try { osc.stop(); } catch(e){} osc.disconnect(); osc = null; }
    osc = audioCtx.createOscillator();
    osc.type = waveType;
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start();
    gain.gain.cancelScheduledValues(audioCtx.currentTime);
    gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.025);
  }

  function stopTone() {
    if (!gain) return;
    gain.gain.cancelScheduledValues(audioCtx.currentTime);
    gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.025);
    const captured = osc;
    setTimeout(() => {
      if (captured) { try { captured.stop(); } catch(e){} captured.disconnect(); }
      if (osc === captured) osc = null;
    }, 200);
  }

  function togglePlay() {
    playing = !playing;
    if (playing) {
      startTone();
      playBtn.classList.add('playing');
      freqDisplay.classList.add('playing');
      freqReadout.classList.add('playing');
      iconPlay.style.display   = 'none';
      iconPause.style.display  = 'block';
      statusDot.classList.add('active');
      statusText.textContent   = 'Playing';
      playBtn.setAttribute('aria-label', 'Pause frequency tone');
    } else {
      stopTone();
      playBtn.classList.remove('playing');
      freqDisplay.classList.remove('playing');
      freqReadout.classList.remove('playing');
      iconPlay.style.display   = 'block';
      iconPause.style.display  = 'none';
      statusDot.classList.remove('active');
      statusText.textContent   = 'Idle';
      playBtn.setAttribute('aria-label', 'Play frequency tone');
    }
  }

  // Validation
  function showErr(msg) { inputError.textContent = msg; freqInput.classList.add('invalid'); }
  function clearErr()   { inputError.textContent = '';  freqInput.classList.remove('invalid'); }

  function applyCustom() {
    const raw = freqInput.value.trim();
    if (!raw) { showErr('Please enter a frequency value.'); return; }
    const f = parseFloat(raw);
    if (isNaN(f) || f < 1 || f > 2000000) {
      showErr('Enter a value between 1 and 2,000,000 Hz.'); return;
    }
    clearErr();
    applyFreq(f);
  }

  // Oscilloscope
  function drawScope(ts) {
    rafId = requestAnimationFrame(drawScope);
    const W = scopeCanvas.width, H = scopeCanvas.height;
    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(76,175,80,0.07)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const x = (W / 8) * i;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let i = 0; i <= 4; i++) {
      const y = (H / 4) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // Centre axis
    ctx.strokeStyle = 'rgba(76,175,80,0.14)';
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

    // Phase advance
    const dt = lastTs ? (ts - lastTs) / 1000 : 0;
    lastTs = ts;
    if (playing) phase = (phase + dt * freq * Math.PI * 2) % (Math.PI * 2);

    const amp    = playing ? 0.42 : 0.16;
    const cycles = Math.max(2, Math.min(8, Math.log10(Math.max(freq, 1)) * 1.6));

    ctx.beginPath();
    ctx.strokeStyle = playing ? '#4caf50' : 'rgba(76,175,80,0.3)';
    ctx.lineWidth   = 1.5 * dpr;
    ctx.shadowBlur  = playing ? 8 * dpr : 0;
    ctx.shadowColor = '#4caf50';
    ctx.lineJoin    = 'round';

    for (let i = 0; i <= W; i++) {
      const t = (i / W) * cycles * Math.PI * 2 + phase;
      let y;
      switch (waveType) {
        case 'sine':     y = Math.sin(t); break;
        case 'square':   y = Math.sign(Math.sin(t)); break;
        case 'sawtooth': y = ((t % (Math.PI * 2)) / (Math.PI * 2)) * 2 - 1; break;
        case 'triangle': y = (2 / Math.PI) * Math.asin(Math.sin(t)); break;
        default:         y = Math.sin(t);
      }
      const py = H / 2 + y * amp * H;
      i === 0 ? ctx.moveTo(0, py) : ctx.lineTo(i, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(drawScope);

  // Event Listeners
  playBtn.addEventListener('click', togglePlay);
  applyBtn.addEventListener('click', applyCustom);
  freqInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyCustom(); });
  freqInput.addEventListener('input', () => {
    const f = parseFloat(freqInput.value);
    if (!isNaN(f) && f >= 1 && f <= 2000000) clearErr();
  });

  freqSlider.addEventListener('input', () => {
    const f = sliderToFreq(parseFloat(freqSlider.value));
    const rounded = parseFloat(f.toFixed(f < 10 ? 2 : f < 100 ? 1 : 0));
    freqInput.value = '';
    clearErr();
    applyFreq(rounded, true);
    setSliderFill(freqSlider, parseFloat(freqSlider.value) / 10);
  });

  volSlider.addEventListener('input', () => {
    vol = parseFloat(volSlider.value) / 100;
    volLabel.textContent = volSlider.value + '%';
    setSliderFill(volSlider, parseFloat(volSlider.value));
    if (gain && playing) gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.02);
  });

  waveBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      waveBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed','true');
      waveType = btn.dataset.wave;
      statusWave.textContent = waveType.charAt(0).toUpperCase() + waveType.slice(1);
      if (playing) {
        stopTone();
        setTimeout(startTone, 80);
      }
    });
  });

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const f = parseFloat(btn.dataset.freq);
      freqInput.value = '';
      clearErr();
      applyFreq(f);
    });
  });

  // Init
  applyFreq(440);
  setSliderFill(volSlider, 70);

})();
</script>
</body>
</html>
